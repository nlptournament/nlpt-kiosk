@if (notFound) {
    <div class="min-h-screen bg-gray-900 flex items-center justify-center">
        <div class="text-center space-y-4">
            <h1 class="text-3xl font-bold text-white">Stream Not Found</h1>
            <p class="text-gray-400">The stream you're looking for is no longer available.</p>
            <a routerLink="/participant" class="inline-flex items-center gap-2 text-blue-400 hover:text-blue-300 transition-colors">
                <i class="pi pi-arrow-left"></i> Back to Participant Interface
            </a>
        </div>
    </div>
} @else if (screen) {
    <screen-stream-player
        [isActive]="true"
        [header]="screen.header"
        [variables]="screen.variables ?? []"
        [showControls]="true">
    </screen-stream-player>
}
